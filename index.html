<div class="loading"><div id="status">FIFTEENTH EVER GARDENを読み込み中…</div><small>v0.25.1</small></div>
<script>
(async()=>{
 try{
  const names=['app1.b64','app2.b64','app3.b64','app4.b64','app5.b64'];
  const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);return r.text()}));
  const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  let html=new TextDecoder('utf-8').decode(bytes);
  html=window.otoPatchBase(html);
  html=window.otoPatchPractice(html);
  html=window.otoPatchV010(html);
  html=window.otoPatchUIV0102(html);
  html=window.otoPatchCeremonyV0104(html);
  html=window.otoPatchKicksV011(html);
  html=window.otoPatchFailV0115(html);
  html=window.otoPatchFailV0116(html);
  html=window.otoPatchPlayV012(html);
  html=window.otoPatchPaceV013(html);
  html=window.otoPatchTimingV014(html);
  html=window.otoPatchUIV015(html);
  html=window.otoPatchBattleV016(html);
  html=window.otoPatchLayoutV017(html);
  html=window.otoPatchRollV018(html);
  html=window.otoPatchAudioV019(html);
  html=window.otoPatchTitleV020(html);
  html=window.otoPatchStagesV021(html);
  html=window.otoPatchDepthV022(html);
  html=window.otoPatchFeelV023(html);
  html=window.otoPatchCombatV024(html);
  html=window.otoPatchRushV025(html);
  html=window.otoPatchBowV0251(html);
  document.open();document.write(html);document.close();
 }catch(e){const el=document.getElementById('status');if(el)el.textContent='読み込みに失敗しました: '+e.message;console.error(e)}
})();
</script>
