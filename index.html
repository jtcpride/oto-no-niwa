<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101f21">
<title>音の庭 — v0.10.3 TIME CLEAR / SLOW BOW</title>
<style>html,body{margin:0;min-height:100%;background:#101f21;color:#f3eddc;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",sans-serif}body{display:grid;place-items:center;padding:24px}.loading{text-align:center;line-height:1.8}.loading small{display:block;color:#b4c7bf;margin-top:8px}</style>
<script src="patch-base.js"></script>
<script src="patch-practice.js"></script>
<script src="patch-v010.js"></script>
<script src="patch-ui-v0102.js"></script>
</head>
<body>
<div class="loading"><div id="status">音の庭を読み込み中…</div><small>v0.10.3 PRACTICE → TIME → 礼 → HAJIME!!!</small></div>
<script>
(async()=>{
 try{
  const names=['app1.b64','app2.b64','app3.b64','app4.b64','app5.b64'];
  const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);return r.text()}));
  const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  let html=new TextDecoder('utf-8').decode(bytes);
  html=window.otoPatchBase(html);
  html=window.otoPatchPractice(html);
  html=window.otoPatchV010(html);
  html=window.otoPatchUIV0102(html);
  document.open();document.write(html);document.close();
 }catch(e){const el=document.getElementById('status');if(el)el.textContent='読み込みに失敗しました: '+e.message;console.error(e)}
})();
</script>
</body>
</html>
