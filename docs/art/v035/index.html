<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五人の造形比較 — FIFTEENTH EVER GARDEN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0ed;color:#253432;font:16px/1.7 system-ui,-apple-system,sans-serif;padding:24px 16px 48px}main{max-width:1100px;margin:auto}h1{font-size:clamp(26px,5vw,36px);line-height:1.3}p{max-width:800px}a{color:#286452}nav,.modes{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{font:inherit;min-height:44px;padding:8px 15px;border:1px solid #aebdb6;border-radius:8px;background:#fff;color:#253432;cursor:pointer}button[aria-pressed=true]{background:#245e4c;color:white;border-color:#245e4c}button:focus-visible{outline:3px solid #c38b3d;outline-offset:3px}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}figure{margin:0;background:white;border:1px solid #cad3cc;border-radius:10px;overflow:hidden}figcaption{padding:10px;font-weight:650;text-align:center}svg{display:block;width:100%;height:auto}.note{font-size:14px;color:#52655c}.links{display:flex;flex-wrap:wrap;gap:10px 22px}@media(max-width:640px){body{padding:18px 10px 40px}.panels{gap:5px}figcaption{font-size:12px;padding:8px 2px}nav{gap:6px}nav button{padding:7px 11px;font-size:14px}}
</style>
<main>
<a href="../../../?v=0350">← ゲームへ</a>
<h1>五人の造形比較</h1>
<p>同じ五人をさらに5回描画して調整。頬と顎、髪と帽子、襟元と衣装を、前回のv0.34・参考画と比べられます。</p>
<nav aria-label="人物" id="people"></nav>
<div class="modes" aria-label="表示範囲"><button type="button" data-mode="full" aria-pressed="true">全身</button><button type="button" data-mode="face" aria-pressed="false">顔</button></div>
<section class="panels" aria-live="polite">
 <figure><figcaption>参考画</figcaption><svg id="reference" role="img" aria-label="AI参考画"><image href="../seven-v032-concept.png" width="1750" height="899"/></svg></figure>
 <figure><figcaption>変更前のモデル</figcaption><svg id="before" role="img" aria-label="変更前の実モデル"><image href="before-gallery.png" width="1620" height="832"/></svg></figure>
 <figure><figcaption>現在のモデル</figcaption><svg id="after" role="img" aria-label="変更後の実モデル"><image href="actual-gallery.png" width="1620" height="832"/></svg></figure>
</section>
<p class="note">参考画は設計用のAI画像です。変更前・現在のモデルは、同じThree.js描画・照明・カメラで撮影しています。ゲームは画像の貼り付けではなく、立体モデルを動かしています。</p>
<div class="links"><a href="portraits.png">実モデルの正面・斜め・横顔</a><a href="REVIEW.md">比較と検証の記録</a></div>
</main>
<script>
const names=[['ルカ',6],['壬生宗吉',2],['粟田澄',3],['北山ナギ',4],['御池コタ',5]];let selected=6,mode='full';
const people=document.getElementById('people');names.forEach(([name,index])=>{const button=document.createElement('button');button.type='button';button.textContent=name;button.onclick=()=>{selected=index;draw()};people.append(button)});
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;draw()});
function draw(){people.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(names[i][1]===selected)));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(mode===b.dataset.mode)));
 document.getElementById('reference').setAttribute('viewBox',`${selected*250} ${mode==='full'?32:600} 250 ${mode==='full'?573:299}`);
 for(const id of ['before','after'])document.getElementById(id).setAttribute('viewBox',`${16+selected*228} ${mode==='full'?104:584} 220 ${mode==='full'?339:236}`);
}draw();
</script>
</html>
