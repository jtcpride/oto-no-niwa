<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FEG — 奥舞台の調整室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c1c;color:#f3eddc;font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}header,main{max-width:1400px;margin:auto;padding:16px}h1{font:600 23px/1.3 Georgia,serif;margin:0 0 6px}p{margin:4px 0;color:#b7c8bf}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;padding-top:0}button,select,input{font:inherit}button,select{min-height:44px;padding:7px 12px;border:1px solid #68867a;border-radius:7px;background:#203631;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#456850;border-color:#d6cb96}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e6c978;outline-offset:3px}button:disabled{opacity:.45}section{min-width:0}.view{background:#081211;display:grid;place-items:center;border:1px solid #3b534c;border-radius:8px;overflow:hidden;height:clamp(330px,65vh,760px)}iframe{border:0;width:100%;height:100%;pointer-events:none}iframe.portrait{width:min(100%,370px)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.row button{flex:1;white-space:nowrap}.timeline{width:100%;min-height:44px;accent-color:#e7ce91}.time{font-variant-numeric:tabular-nums;color:#e7ce91}.stats{font-size:12px;min-height:22px}.panel{border:1px solid #3b534c;border-radius:8px;padding:14px;background:#142722}h2{font-size:16px;margin:0 0 8px}.control{display:block;margin:0 0 13px}.control span{display:flex;justify-content:space-between;gap:8px}.control output{font-variant-numeric:tabular-nums;color:#e7ce91}.control input{width:100%;height:32px;accent-color:#bacc99}.note{font-size:13px;margin:12px 0}.status{min-height:24px;color:#e7ce91}label.check{display:flex;align-items:center;gap:6px;min-height:44px}#import{display:none}@media(max-width:760px){main{grid-template-columns:1fr;gap:14px}header,main{padding:12px}.view{height:50svh;min-height:300px}iframe.portrait{width:100%}.panel{padding:12px}.control input{height:40px}}
</style>
<style>.view[data-orientation="portrait"]{height:clamp(540px,80svh,844px)}</style>
</head>
<body>
<header><h1>FIFTEENTH EVER GARDEN · 奥舞台の調整室</h1><p>溜め → 吹き飛び → 着地 → 追走。同じ場面を比べます。</p></header>
<main>
<section aria-label="再生と比較">
<div class="view"><iframe id="game" src="/__pursuit-game?stage=jingu" title="一ノ庭の演出プレビュー" tabindex="-1"></iframe></div>
<div class="row"><button id="baseline" aria-pressed="false">変更前</button><button id="adjusted" aria-pressed="true">調整中</button><button id="proposal">採用版を試す</button></div>
<div class="row"><button id="play" disabled>再生</button><button id="restart" disabled>最初から</button><select id="speed" aria-label="再生速度"><option value="1">通常速度</option><option value="0.5">1/2 スロー</option><option value="0.25">1/4 スロー</option></select><select id="orientation" aria-label="画面の向き"><option value="landscape">横画面</option><option value="portrait">縦画面</option></select><label class="check"><input id="loop" type="checkbox" checked>繰り返し</label></div>
<label for="timeline">場面の位置 <output id="time" class="time">0.00 / 4.70秒</output></label><input id="timeline" class="timeline" type="range" min="0" max="4.7" step="0.01" value="0" disabled>
<p id="phase">読み込み中…</p><p id="stats" class="stats"></p>
<p class="note">音なし。本編と同じ動作・描画を使用します。操作やセーブは通常ゲームに反映されません。</p>
</section>
<section class="panel" aria-label="演出の調整"><h2>調整するところ</h2><div id="controls"></div><div class="row"><button id="reset">採用値に戻す</button></div><div class="row"><button id="export">設定を書き出す</button><button id="load">設定を読み込む</button></div><input id="import" type="file" accept=".json,application/json"><p class="note">採用版を本編の既定値に反映済み。ここでの追加調整は、本編には自動適用されません。</p><p id="status" class="status" role="status"></p></section>
</main>
<script src="/tools/pursuit-lab.js"></script>
</body></html>
